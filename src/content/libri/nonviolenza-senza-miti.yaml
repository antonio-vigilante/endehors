titolo: Nonviolenza senza miti
autore: Antonio Vigilante
ordine: 4
anno: 2020
tag:
  - Nonviolenza
copertina: ../../assets/copertine/nonviolenza-senza-miti.jpg
citazione: >-
  Realmente la verità è forte? È davvero sempre possibile trascendere i conflitti? È realizzabile il potere di tutti? Ogni essere umano è convertibile al bene?
descrizione:
  - Antonio Vigilante discute criticamente queste ed altre affermazioni ricorrenti nel discorso nonviolento, proponendo una nonviolenza laica, disincantata, individualista, che fa appello più alla giustizia che all’amore.
note_autori:
  - Antonio Vigilante è autore di numerosi studi sulla nonviolenza, tra cui *Il Dio di Gandhi. Religione, etica e politica* (2009), *La pedagogia di Gandhi* (2010), *Ecologia del potere. Studio su Danilo Dolci* (2012), *L’educazione è pace* (2014), *L’essere e il tu. Aldo Capitini in dialogo con Nishitani Keiji, Enrique Dussel e Murray Bookchin* (2019).
